name: JiraSummary
options:
  bundleIdPrefix: com.jordankoch
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  NovaAIKit:
    url: https://github.com/kochj23/NovaAIKit.git
    from: 1.0.0

targets:
  JiraSummary:
    type: application
    platform: macOS
    sources:
      - path: JiraSummary
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordankoch.JiraSummary
        PRODUCT_NAME: JiraSummary
        INFOPLIST_FILE: JiraSummary/Info.plist
        CODE_SIGN_ENTITLEMENTS: JiraSummary/JiraSummary.entitlements
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGNING_ALLOWED: false
    dependencies:
      - package: NovaAIKit
        product: NovaAIKit
    entitlements:
      path: JiraSummary/JiraSummary.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    scheme:
      testTargets:
        - JiraSummaryTests
      gatherCoverageData: false

  JiraSummaryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JiraSummaryTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordankoch.JiraSummaryTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JiraSummary.app/Contents/MacOS/JiraSummary"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: JiraSummary
      - package: NovaAIKit
        product: NovaAIKit
